<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro — Log Session</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Natural Language Card ──────────────────────────────────────── */
    .nl-card {
      background: linear-gradient(145deg, rgba(22,163,74,0.10), rgba(5,13,5,0.75));
      border: 1px solid var(--neon-border);
      border-radius: var(--r-lg);
      padding: 24px 26px 20px;
      margin-bottom: 20px;
      position: relative; overflow: hidden;
      backdrop-filter: blur(10px);
    }
    .nl-card::before {
      content: '';
      position: absolute; top: -40px; right: -40px;
      width: 130px; height: 130px; border-radius: 50%;
      background: radial-gradient(circle, var(--neon-glow) 0%, transparent 70%);
      opacity: 0.3; pointer-events: none;
    }
    /* Subtle grid overlay */
    .nl-card::after {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(var(--neon-border) 1px, transparent 1px),
        linear-gradient(90deg, var(--neon-border) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.25;
      pointer-events: none;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 0%, transparent 70%);
    }

    .nl-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.68rem; font-weight: 800; color: var(--neon);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px;
      position: relative; z-index: 1;
    }
    .nl-badge {
      background: var(--neon-soft); border: 1px solid var(--neon-border);
      border-radius: var(--r-full); padding: 2px 10px;
      font-size: 0.62rem; color: var(--neon); font-weight: 700; letter-spacing: 0.5px;
    }

    .nl-input-row { display: flex; gap: 10px; align-items: center; position: relative; z-index: 1; }
    .nl-input {
      flex: 1; padding: 13px 16px;
      background: rgba(255,255,255,0.06);
      border: 1.5px solid var(--glass-bd2);
      border-radius: var(--r-sm); color: var(--tw);
      font-size: 0.95rem; font-family: inherit;
      transition: all 0.2s; caret-color: var(--neon);
    }
    .nl-input::placeholder { color: var(--tw20); }
    .nl-input:focus { outline: none; border-color: var(--neon-border); background: rgba(255,255,255,0.09); box-shadow: 0 0 0 3px rgba(74,222,128,0.12); }
    .nl-input.nl-has-result { border-color: var(--neon-border); }

    /* Preview */
    .nl-preview {
      margin-top: 14px; background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-bd); border-radius: var(--r-sm);
      padding: 14px 16px; display: none;
      animation: fadeIn 0.2s var(--ease);
      position: relative; z-index: 1;
    }
    .nl-preview.visible { display: block; }
    .nl-preview-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .nl-preview-row:last-child { margin-bottom: 0; }
    .nl-chip-label { font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; color: var(--tw40); min-width: 72px; padding-top: 3px; }
    .nl-chip {
      background: var(--neon-soft); border: 1px solid var(--neon-border);
      border-radius: var(--r-full); padding: 3px 14px;
      font-size: 0.82rem; font-weight: 700; color: var(--tw);
      max-width: calc(100% - 82px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .nl-chip.missing { background: rgba(239,68,68,0.10); border-color: rgba(239,68,68,0.3); color: rgba(252,165,165,0.85); font-style: italic; font-weight: 600; }

    .nl-preview-actions { display: flex; gap: 8px; margin-top: 14px; }
    .nl-btn-use {
      flex: 1; padding: 10px; background: var(--neon); color: var(--td);
      border: none; border-radius: var(--r-sm); font-size: 0.83rem; font-weight: 800;
      cursor: pointer; transition: all 0.2s var(--ease);
      box-shadow: 0 3px 14px var(--neon-glow); font-family: inherit;
    }
    .nl-btn-use:hover { transform: translateY(-1px); box-shadow: 0 6px 20px var(--neon-glow); }
    .nl-btn-use:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }
    .nl-btn-clear {
      padding: 10px 16px; background: transparent; color: var(--tw40);
      border: 1px solid var(--glass-bd); border-radius: var(--r-sm);
      font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: all 0.2s; font-family: inherit;
    }
    .nl-btn-clear:hover { color: var(--tw); border-color: var(--glass-bd2); }

    /* Example pills */
    .nl-examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; position: relative; z-index: 1; }
    .nl-example-pill {
      padding: 4px 13px; border-radius: var(--r-full);
      border: 1px dashed var(--glass-bd); background: transparent;
      color: var(--tw40); font-size: 0.71rem; font-weight: 500;
      cursor: pointer; transition: all 0.18s; font-family: inherit; text-align: left;
    }
    .nl-example-pill:hover { border-color: var(--neon-border); color: var(--neon); background: var(--neon-soft); }

    /* OR divider */
    .or-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 4px 0 20px; color: var(--tw20);
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .or-divider::before, .or-divider::after { content: ''; flex: 1; height: 1px; background: var(--glass-bd); }

    @keyframes nlFlash {
      0%   { box-shadow: 0 0 0 0 var(--neon-glow); }
      50%  { box-shadow: 0 0 0 10px rgba(74,222,128,0); }
      100% { box-shadow: none; }
    }
    .nl-card.flash { animation: nlFlash 0.6s ease-out; }
  </style>
</head>
<body>
  <div class="page-narrow">

    <div class="page-header">
      <div class="page-eyebrow">📝 Log</div>
      <h1>Log a Session</h1>
      <p>Use smart input, voice, or fill the form manually.</p>
    </div>

    <!-- ── Smart NL Card ─────────────────────────────────────────────── -->
    <div class="nl-card" id="nl-card">
      <div class="nl-label">
        ✨ Smart Input
        <span class="nl-badge">AI-powered</span>
      </div>

      <div class="nl-input-row">
        <input id="nl-input" class="nl-input" type="text"
          autocomplete="off" spellcheck="false"
          placeholder='Try "2 pomodoros on auth bug" or "spent 45 mins on API design"'
          aria-label="Natural language session input" />
        <button type="button" class="nl-mic-btn" id="nl-mic-btn"
          aria-label="Speak your session">🎙️</button>
      </div>

      <div class="nl-preview" id="nl-preview" aria-live="polite">
        <div class="nl-preview-row">
          <span class="nl-chip-label">Description</span>
          <span class="nl-chip" id="nl-chip-desc">—</span>
        </div>
        <div class="nl-preview-row">
          <span class="nl-chip-label">Duration</span>
          <span class="nl-chip" id="nl-chip-dur">—</span>
        </div>
        <div class="nl-preview-actions">
          <button class="nl-btn-use" id="nl-btn-use" disabled>✅ Use this — fill form</button>
          <button class="nl-btn-clear" id="nl-btn-clear">Clear</button>
        </div>
      </div>

      <div class="nl-examples" id="nl-examples">
        <button class="nl-example-pill" data-text="2 pomodoros on the auth bug">2 pomodoros on the auth bug</button>
        <button class="nl-example-pill" data-text="spent 45 mins on API design">spent 45 mins on API design</button>
        <button class="nl-example-pill" data-text="deep work on feature X for 25 minutes">deep work on feature X for 25 min</button>
        <button class="nl-example-pill" data-text="code review about an hour">code review about an hour</button>
        <button class="nl-example-pill" data-text="debugging login flow roughly 30 mins">debugging login ~30 mins</button>
      </div>
    </div>

    <div class="or-divider">or fill manually</div>

    <!-- ── Manual form ────────────────────────────────────────────────── -->
    <div class="log-card">
      <form id="log-form" novalidate>
        <div class="field">
          <label for="description">What did you work on?</label>
          <div class="input-with-mic">
            <input id="description" type="text"
              placeholder='e.g. "Deep work on API design"' required />
            <button type="button" class="mic-btn" id="voice-btn"
              aria-label="Start voice input">🎙️</button>
          </div>
          <div id="voice-status" class="voice-status" style="display:none"></div>
          <span class="field-error hidden" id="description-error">Description cannot be empty.</span>
        </div>

        <div class="field">
          <label for="duration">Duration (minutes)</label>
          <div class="duration-presets" id="duration-presets">
            <button type="button" class="preset-pill" data-mins="15">15 min</button>
            <button type="button" class="preset-pill active" data-mins="25">25 min</button>
            <button type="button" class="preset-pill" data-mins="45">45 min</button>
            <button type="button" class="preset-pill" data-mins="60">60 min</button>
            <button type="button" class="preset-pill" data-mins="90">90 min</button>
          </div>
          <input id="duration" type="number" min="1" max="120"
            placeholder="Or type 1–120" value="25" required />
          <span class="field-error hidden" id="duration-error">Duration must be between 1 and 120.</span>
        </div>

        <button type="submit" class="btn-primary">🍅 Log Session</button>
      </form>
      <div id="log-message" class="message hidden"></div>
    </div>

    <div class="section-label" style="margin-top:28px">Recent sessions</div>
    <div id="recent-content"><p class="loading">Loading…</p></div>

  </div>

  <!-- Inline validation (capture phase, before module submit) -->
  <script>
    const form      = document.getElementById('log-form');
    const descInput = document.getElementById('description');
    const durInput  = document.getElementById('duration');
    const descError = document.getElementById('description-error');
    const durError  = document.getElementById('duration-error');

    function validateDesc() {
      const ok = descInput.value.trim().length > 0;
      descInput.classList.toggle('input-invalid', !ok);
      descInput.classList.toggle('input-valid',   ok);
      descError.classList.toggle('hidden', ok);
      return ok;
    }
    function validateDur() {
      const v = parseInt(durInput.value, 10);
      const ok = !isNaN(v) && v >= 1 && v <= 120;
      durInput.classList.toggle('input-invalid', !ok);
      durInput.classList.toggle('input-valid',   ok);
      durError.classList.toggle('hidden', ok);
      return ok;
    }

    descInput.addEventListener('blur',  validateDesc);
    durInput.addEventListener('blur',   validateDur);
    descInput.addEventListener('input', () => {
      if (descInput.value.trim()) { descInput.classList.remove('input-invalid'); descError.classList.add('hidden'); }
    });
    durInput.addEventListener('input', () => {
      const v = parseInt(durInput.value, 10);
      if (!isNaN(v) && v >= 1 && v <= 120) { durInput.classList.remove('input-invalid'); durError.classList.add('hidden'); }
      document.querySelectorAll('.preset-pill').forEach(p => {
        p.classList.toggle('active', parseInt(p.dataset.mins, 10) === v);
      });
    });

    document.getElementById('duration-presets').addEventListener('click', e => {
      const pill = e.target.closest('.preset-pill');
      if (!pill) return;
      document.querySelectorAll('.preset-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      durInput.value = pill.dataset.mins;
      durInput.classList.remove('input-invalid');
      durError.classList.add('hidden');
    });

    form.addEventListener('submit', e => {
      if (!validateDesc() | !validateDur()) { e.stopImmediatePropagation(); e.preventDefault(); }
    }, true);
  </script>

  <script type="module" src="pages/log.js"></script>
</body>
</html>

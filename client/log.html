<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro — Log Session</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Natural Language Input ─────────────────────────────────── */
    .nl-card {
      background: linear-gradient(145deg, var(--brand-800), var(--brand-900));
      border: 1px solid rgba(82,162,82,0.25);
      border-radius: var(--r-lg);
      padding: 24px 26px 20px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .nl-card::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 130px; height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(82,162,82,0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .nl-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--brand-300);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }
    .nl-label-badge {
      background: rgba(82,162,82,0.2);
      border: 1px solid rgba(82,162,82,0.35);
      border-radius: var(--r-full);
      padding: 2px 9px;
      font-size: 0.65rem;
      color: var(--brand-200);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .nl-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .nl-input {
      flex: 1;
      padding: 13px 16px;
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(255,255,255,0.14);
      border-radius: var(--r-sm);
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      caret-color: var(--brand-300);
    }
    .nl-input::placeholder { color: rgba(255,255,255,0.3); }
    .nl-input:focus {
      outline: none;
      border-color: rgba(82,162,82,0.6);
      background: rgba(255,255,255,0.1);
      box-shadow: 0 0 0 3px rgba(82,162,82,0.15);
    }
    .nl-input.nl-has-result {
      border-color: rgba(82,162,82,0.5);
    }

    .nl-mic-btn {
      flex-shrink: 0;
      width: 46px; height: 46px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 1.15rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s var(--ease-spring);
    }
    .nl-mic-btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.35); transform: scale(1.07); }
    .nl-mic-btn.mic-listening {
      background: rgba(220,80,80,0.25);
      border-color: rgba(255,120,120,0.6);
      animation: mic-pulse-light 1.2s ease-in-out infinite;
    }

    /* Live parse preview card */
    .nl-preview {
      margin-top: 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--r-sm);
      padding: 14px 16px;
      display: none;
      animation: fadeIn 0.2s var(--ease-out);
    }
    .nl-preview.visible { display: block; }

    .nl-preview-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .nl-preview-row:last-child { margin-bottom: 0; }

    .nl-chip-label {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: rgba(255,255,255,0.4);
      min-width: 70px;
      padding-top: 2px;
    }
    .nl-chip {
      background: rgba(82,162,82,0.2);
      border: 1px solid rgba(82,162,82,0.35);
      border-radius: var(--r-full);
      padding: 3px 13px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #fff;
      max-width: calc(100% - 80px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .nl-chip.missing {
      background: rgba(200,80,80,0.15);
      border-color: rgba(200,80,80,0.3);
      color: rgba(255,180,180,0.85);
      font-style: italic;
      font-weight: 600;
    }

    .nl-preview-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .nl-btn-use {
      flex: 1;
      padding: 10px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--r-sm);
      font-size: 0.83rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s var(--ease-out);
      box-shadow: 0 3px 12px var(--accent-glow);
    }
    .nl-btn-use:hover { background: var(--brand-500); transform: translateY(-1px); }
    .nl-btn-use:disabled {
      opacity: 0.4; cursor: not-allowed; transform: none;
      box-shadow: none;
    }
    .nl-btn-clear {
      padding: 10px 16px;
      background: transparent;
      color: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: var(--r-sm);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nl-btn-clear:hover { color: #fff; border-color: rgba(255,255,255,0.35); }

    /* Hint examples */
    .nl-examples {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 14px;
    }
    .nl-example-pill {
      padding: 4px 12px;
      border-radius: var(--r-full);
      border: 1px dashed rgba(255,255,255,0.18);
      background: transparent;
      color: rgba(255,255,255,0.38);
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
      font-family: inherit;
      text-align: left;
    }
    .nl-example-pill:hover {
      border-color: rgba(82,162,82,0.5);
      color: var(--brand-200);
      background: rgba(82,162,82,0.08);
    }

    /* Divider between NL and manual form */
    .or-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 4px 0 20px;
      color: rgba(255,255,255,0.3);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .or-divider::before,
    .or-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }

    /* Success flash on the NL card */
    @keyframes nlSuccess {
      0%   { box-shadow: 0 0 0 0 rgba(82,162,82,0.5); }
      50%  { box-shadow: 0 0 0 8px rgba(82,162,82,0); }
      100% { box-shadow: none; }
    }
    .nl-card.flash-success { animation: nlSuccess 0.6s ease-out; }
  </style>
</head>
<body>
  <div class="page-narrow">

    <p class="section-title">📝 Log a Session</p>
    <p class="section-subtitle">Use natural language, voice, or fill the form manually.</p>

    <!-- ── Natural Language Card ────────────────────────────────────── -->
    <div class="nl-card" id="nl-card">
      <div class="nl-label">
        ✨ Smart Input
        <span class="nl-label-badge">AI-powered</span>
      </div>

      <div class="nl-input-row">
        <input
          id="nl-input"
          class="nl-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder='Try "2 pomodoros on auth bug" or "spent 45 mins on API design"'
          aria-label="Natural language session input"
        />
        <button type="button" class="nl-mic-btn" id="nl-mic-btn"
          aria-label="Speak your session"
          title="Click to speak">🎙️</button>
      </div>

      <!-- Live parse preview — shown once user types -->
      <div class="nl-preview" id="nl-preview" aria-live="polite">
        <div class="nl-preview-row">
          <span class="nl-chip-label">Description</span>
          <span class="nl-chip" id="nl-chip-desc">—</span>
        </div>
        <div class="nl-preview-row">
          <span class="nl-chip-label">Duration</span>
          <span class="nl-chip" id="nl-chip-dur">—</span>
        </div>
        <div class="nl-preview-actions">
          <button class="nl-btn-use" id="nl-btn-use" disabled>
            ✅ Use this — fill form
          </button>
          <button class="nl-btn-clear" id="nl-btn-clear">Clear</button>
        </div>
      </div>

      <!-- Example prompts -->
      <div class="nl-examples" id="nl-examples">
        <button class="nl-example-pill" data-text="2 pomodoros on the auth bug">2 pomodoros on the auth bug</button>
        <button class="nl-example-pill" data-text="spent 45 mins on API design">spent 45 mins on API design</button>
        <button class="nl-example-pill" data-text="deep work on feature X for 25 minutes">deep work on feature X for 25 min</button>
        <button class="nl-example-pill" data-text="code review about an hour">code review about an hour</button>
        <button class="nl-example-pill" data-text="debugging login flow roughly 30 mins">debugging login flow ~30 mins</button>
      </div>
    </div>

    <!-- ── Divider ──────────────────────────────────────────────────── -->
    <div class="or-divider">or fill manually</div>

    <!-- ── Manual Form ──────────────────────────────────────────────── -->
    <div class="log-card">
      <form id="log-form" novalidate>

        <div class="field">
          <label for="description">What did you work on?</label>
          <div class="input-with-mic">
            <input id="description" type="text"
              placeholder='e.g. "Deep work on API design"' required />
            <button type="button" class="mic-btn" id="voice-btn"
              aria-label="Start voice input"
              title="Click and speak — duration is extracted automatically">🎙️</button>
          </div>
          <div id="voice-status" class="voice-status" style="display:none"></div>
          <span class="field-error hidden" id="description-error">Description cannot be empty.</span>
        </div>

        <div class="field">
          <label for="duration">Duration (minutes)</label>
          <div class="duration-presets" id="duration-presets">
            <button type="button" class="preset-pill" data-mins="15">15 min</button>
            <button type="button" class="preset-pill active" data-mins="25">25 min</button>
            <button type="button" class="preset-pill" data-mins="45">45 min</button>
            <button type="button" class="preset-pill" data-mins="60">60 min</button>
            <button type="button" class="preset-pill" data-mins="90">90 min</button>
          </div>
          <input id="duration" type="number" min="1" max="120"
            placeholder="Or type 1–120" value="25" required />
          <span class="field-error hidden" id="duration-error">Duration must be between 1 and 120.</span>
        </div>

        <button type="submit" class="btn-primary">🍅 Log Session</button>
      </form>
      <div id="log-message" class="message hidden"></div>
    </div>

    <p class="section-title" style="margin-top:28px">Recent sessions</p>
    <div id="recent-content"><p class="loading">Loading…</p></div>

  </div>

  <!-- Validation runs in capture phase, before the module submit handler -->
  <script>
    const form      = document.getElementById('log-form');
    const descInput = document.getElementById('description');
    const durInput  = document.getElementById('duration');
    const descError = document.getElementById('description-error');
    const durError  = document.getElementById('duration-error');

    function validateDescription() {
      const ok = descInput.value.trim().length > 0;
      descInput.classList.toggle('input-invalid', !ok);
      descInput.classList.toggle('input-valid',   ok);
      descError.classList.toggle('hidden', ok);
      return ok;
    }

    function validateDuration() {
      const v  = parseInt(durInput.value, 10);
      const ok = !isNaN(v) && v >= 1 && v <= 120;
      durInput.classList.toggle('input-invalid', !ok);
      durInput.classList.toggle('input-valid',   ok);
      durError.classList.toggle('hidden', ok);
      return ok;
    }

    descInput.addEventListener('blur',  validateDescription);
    durInput.addEventListener('blur',   validateDuration);
    descInput.addEventListener('input', () => {
      if (descInput.value.trim()) {
        descInput.classList.remove('input-invalid');
        descError.classList.add('hidden');
      }
    });
    durInput.addEventListener('input', () => {
      const v = parseInt(durInput.value, 10);
      if (!isNaN(v) && v >= 1 && v <= 120) {
        durInput.classList.remove('input-invalid');
        durError.classList.add('hidden');
      }
    });

    /* Duration preset pills */
    document.getElementById('duration-presets').addEventListener('click', (e) => {
      const pill = e.target.closest('.preset-pill');
      if (!pill) return;
      document.querySelectorAll('.preset-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      durInput.value = pill.dataset.mins;
      durInput.classList.remove('input-invalid');
      durError.classList.add('hidden');
    });

    /* Keep preset pills in sync when user types manually */
    durInput.addEventListener('input', () => {
      const v = parseInt(durInput.value, 10);
      document.querySelectorAll('.preset-pill').forEach(p => {
        p.classList.toggle('active', parseInt(p.dataset.mins, 10) === v);
      });
    });

    form.addEventListener('submit', (e) => {
      if (!validateDescription() | !validateDuration()) {
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    }, true);
  </script>

  <script type="module" src="pages/log.js"></script>
</body>
</html>
